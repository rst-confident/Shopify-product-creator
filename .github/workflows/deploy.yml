name: Deploy to Google Cloud VM

on:
  # Automatic deployment disabled due to SSH docker permission issues
  # Deploy manually on VM instead: cd ~/shopify-product-import && ./deploy.sh
  workflow_dispatch:  # Keep manual trigger option

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Google Cloud VM
        env:
          GCP_USER: ${{ secrets.GCP_USER }}
          GCP_HOST: ${{ secrets.GCP_HOST }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          ssh $GCP_USER@$GCP_HOST << 'ENDSSH'
            set -e

            echo "========================================"
            echo "Starting Deployment"
            echo "========================================"

            # Define app directory (separate from n8n)
            APP_DIR="/home/ubuntu/shopify-product-import"
            BRANCH="${DEPLOY_BRANCH}"

            # Create app directory if it doesn't exist
            if [ ! -d "$APP_DIR" ]; then
              echo "Creating app directory..."
              mkdir -p "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Clone repo if it doesn't exist
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/rst-confident/Shopify-product-creator.git .
            fi

            # Fetch and checkout the correct branch
            echo "Fetching latest changes..."
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            # Check if .env file exists, create from example if not
            if [ ! -f .env ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
              echo "WARNING: .env created from template. Please configure it manually!"
            fi

            # Run deployment script which handles everything
            echo "Running deployment script..."
            bash deploy.sh

            echo "========================================"
            echo "Deployment completed successfully!"
            echo "========================================"
          ENDSSH

      - name: Verify deployment
        env:
          GCP_USER: ${{ secrets.GCP_USER }}
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          sleep 10
          ssh $GCP_USER@$GCP_HOST << 'ENDSSH'
            cd /home/ubuntu/shopify-product-import

            echo "Verifying deployment..."

            # Check if containers are running
            if docker-compose ps | grep -q "Up"; then
              echo "✅ Containers are running"
            else
              echo "❌ Containers are not running properly"
              docker-compose logs --tail=50
              exit 1
            fi

            # Check application health
            echo "Checking application health..."
            curl -f http://localhost:3001/api/health || {
              echo "❌ Health check failed"
              docker-compose logs --tail=50 app
              exit 1
            }

            echo "✅ Deployment verification successful!"
          ENDSSH

      - name: Show logs on failure
        if: failure()
        env:
          GCP_USER: ${{ secrets.GCP_USER }}
          GCP_HOST: ${{ secrets.GCP_HOST }}
        run: |
          ssh $GCP_USER@$GCP_HOST << 'ENDSSH'
            cd /home/ubuntu/shopify-product-import
            echo "=== Application Logs ==="
            docker-compose logs --tail=100
          ENDSSH

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

      - name: Deployment summary
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
            echo "Application is running at: http://${{ secrets.GCP_HOST }}:3001"
            echo "Health check: http://${{ secrets.GCP_HOST }}:3001/api/health"
          else
            echo "❌ Deployment failed! Check the logs above for details."
          fi
