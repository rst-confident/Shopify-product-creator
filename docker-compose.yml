version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopify-import-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopify_import}
      POSTGRES_USER: ${POSTGRES_USER:-shopify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5433:5432"  # Use 5433 externally to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopify_user} -d ${POSTGRES_DB:-shopify_import}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopify-import-network

  app:
    build: .
    container_name: shopify-import-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"  # Use 3001 externally to avoid conflicts with n8n
    environment:
      # Shopify Configuration
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-read_products,write_products,read_inventory,write_inventory}
      SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:-https://produktimport.wemarket.dk}
      HOST: ${HOST:-https://produktimport.wemarket.dk}

      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopify_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopify_import}

      # OpenRouter AI Configuration
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-anthropic/claude-3.5-sonnet}

      # Security
      SESSION_SECRET: ${SESSION_SECRET}

      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}

    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - uploads:/app/uploads
    networks:
      - shopify-import-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  shopify-import-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local
